<!DOCTYPE html>
<html>
<head>
  <title>JoyAI Studio - Live Connect</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' wss://joyai-gateway.onrender.com; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <style>
    body { background: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; }
    .video-container { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
    .feed { display: flex; flex-direction: column; align-items: center; }
    video, img { width: 480px; height: 360px; background: #000; border: 2px solid #333; border-radius: 12px; object-fit: cover; }
    button { margin-top: 30px; padding: 15px 30px; font-size: 18px; font-weight: bold; background: #00ff88; color: #000; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #00cc6a; transform: scale(1.05); }
    button:disabled { background: #555; cursor: not-allowed; transform: none; }
    #status { font-size: 18px; margin-top: 15px; color: #aaa; }
    .live { color: #00ff88 !important; font-weight: bold; }
  </style>
</head>
<body>
  <h1>JoyAI Studio ⚡</h1>
  <p id="status">Status: Disconnected</p>
  
  <div class="video-container">
    <div class="feed">
      <h3>Your Camera</h3>
      <video id="localVideo" autoplay playsinline></video>
    </div>
    <div class="feed">
      <h3>AI Output (RunPod)</h3>
      <img id="outputImage" alt="Waiting for AI connection..." />
    </div>
  </div>

  <button id="startBtn">Connect to Render Gateway</button>

  <script src="./renderer.js"></script>
</body>
</html>
